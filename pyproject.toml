[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discworld-copilot"
version = "0.1.0"
description = "Discworld MUD client with an LLM co-pilot that advises, never plays"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aidan Jones" }]
dependencies = []

[project.scripts]
dwcopilot = "dwcopilot.cli:main"

[tool.setuptools]
packages = ["dwcopilot"]
