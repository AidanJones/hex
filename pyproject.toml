[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hex"
version = "0.1.0"
description = "Discworld MUD client with an LLM thinking engine that advises, never plays"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aidan Jones" }]
dependencies = []

[project.optional-dependencies]
tui = ["textual>=8"]

[project.scripts]
hex = "hex.cli:main"

[tool.setuptools]
packages = ["hex"]
